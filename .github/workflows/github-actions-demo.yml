
name: GitHub Actions Demo Test

on:
  workflow_dispatch:

jobs:
  demo-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Execute sample test
        run: |
          echo "ISO8583 QA Automation - GitHub Actions"
          echo "Sample workflow executed successfully"
