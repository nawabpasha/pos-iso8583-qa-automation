
name: ISO8583 QA Automation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  iso8583-tests:
    name: Run ISO8583 Tests via AWS SSM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::723695983909:role/GitHub-ISO8583-QA-Role
          aws-region: us-east-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Execute ISO8583 JUnit tests on EC2
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-092742ccfa413e5f3" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["set -e","cd /home/ec2-user/pos-iso8583-qa-automation","export JAVA_HOME=/usr/lib/jvm/java-25-amazon-corretto.x86_64","export PATH=$JAVA_HOME/bin:$PATH","export MAVEN_OPTS=-Xmx192m","export TCP_HOST=172.31.13.107","export TCP_PORT=8583","runuser -u ec2-user -- mvn -B -Dtest=JposTcpTest,JposParameterizedTest -DargLine=-Xmx128m test"]}' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1
          WAIT_EXIT=$?
          set -e

          echo "========== ISO8583 TEST EXECUTION LOGS =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1 \
            --query 'StandardOutputContent' \
            --output text

          echo "========== ERROR LOGS =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1 \
            --query 'StandardErrorContent' \
            --output text

          exit "$WAIT_EXIT"
