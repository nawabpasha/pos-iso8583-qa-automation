name: ISO8583 QA Automation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  iso8583-tests:
    name: Run ISO8583 Tests via AWS SSM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::723695983909:role/GitHub-ISO8583-QA-Role
          aws-region: us-east-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Discover running Fargate private IP
        id: ecs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t TASK_ARNS < <(aws ecs list-tasks \
            --cluster fargate-connectivity-cluster \
            --family fargate-connectivity-e2e \
            --desired-status RUNNING \
            --region us-east-1 \
            --query 'taskArns[]' \
            --output text | tr '\t' '\n' | sed '/^$/d')

          if [ "${#TASK_ARNS[@]}" -ne 1 ]; then
            echo "Expected exactly one running E2E task, found ${#TASK_ARNS[@]}." >&2
            exit 1
          fi

          TASK_ARN="${TASK_ARNS[0]}"
          echo "Discovered task: $TASK_ARN"

          TCP_HOST=$(aws ecs describe-tasks \
            --cluster fargate-connectivity-cluster \
            --tasks "$TASK_ARN" \
            --region us-east-1 \
            --query 'tasks[0].attachments[0].details[?name==`privateIPv4Address`].value | [0]' \
            --output text)

          if [[ -z "$TCP_HOST" || "$TCP_HOST" == "None" ]]; then
            echo "Could not determine the Fargate private IP." >&2
            exit 1
          fi

          echo "Discovered private IP: $TCP_HOST"
          echo "tcp_host=$TCP_HOST" >> "$GITHUB_OUTPUT"

      - name: Run ISO8583 tests on EC2 using SSM
        shell: bash
        env:
          TCP_HOST: ${{ steps.ecs.outputs.tcp_host }}
        run: |
          set -euo pipefail

          PARAMETERS=$(jq -nc --arg host "$TCP_HOST" '{commands:[
            "set -e",
            "cd /home/ec2-user/pos-iso8583-qa-automation",
            "export JAVA_HOME=/usr/lib/jvm/java-25-amazon-corretto.x86_64",
            "export PATH=$JAVA_HOME/bin:$PATH",
            "export MAVEN_OPTS=-Xmx192m",
            ("export TCP_HOST=" + $host),
            "export TCP_PORT=8583",
            "runuser -u ec2-user -- mvn -B -Dtest=JposTcpTest,JposParameterizedTest -DargLine=-Xmx128m test"
          ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-092742ccfa413e5f3" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --region us-east-1 \
            --query 'Command.CommandId' \
            --output text)

          if [[ -z "$COMMAND_ID" || "$COMMAND_ID" == "None" ]]; then
            echo "SSM did not return a command ID." >&2
            exit 1
          fi
          echo "SSM Command ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1
          WAIT_EXIT=$?
          set -e

          echo "========== ISO8583 TEST EXECUTION LOGS =========="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1 \
            --query 'StandardOutputContent' \
            --output text

          echo "========== ERROR LOGS =========="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1 \
            --query 'StandardErrorContent' \
            --output text

          exit "$WAIT_EXIT"
