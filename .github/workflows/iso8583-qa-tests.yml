
name: ISO8583 QA Automation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  iso8583-tests:
    name: Run ISO8583 Tests via AWS SSM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::723695983909:role/GitHub-ISO8583-QA-Role
          aws-region: us-east-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity
      - name: Verify ECS task private IP discovery
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster fargate-connectivity-cluster \
            --family fargate-connectivity-e2e \
            --desired-status RUNNING \
            --region us-east-1 \
            --query 'taskArns[0]' \
            --output text)

          echo "Discovered task: $TASK_ARN"

          aws ecs describe-tasks \
            --cluster fargate-connectivity-cluster \
            --tasks "$TASK_ARN" \
            --region us-east-1 \
            --query 'tasks[0].attachments[0].details[?name==`privateIPv4Address`].value | [0]' \
            --output text

          echo "SSM Command ID: $COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1
          WAIT_EXIT=$?
          set -e

          echo "========== ISO8583 TEST EXECUTION LOGS =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1 \
            --query 'StandardOutputContent' \
            --output text

          echo "========== ERROR LOGS =========="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1 \
            --query 'StandardErrorContent' \
            --output text

          exit "$WAIT_EXIT"
