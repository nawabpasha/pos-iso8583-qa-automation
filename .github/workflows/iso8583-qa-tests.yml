
name: ISO8583 QA Automation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  iso8583-tests:
    name: Verify GitHub AWS OIDC
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          request = urllib.request.Request(
              url + "&audience=sts.amazonaws.com",
              headers={"Authorization": f"Bearer {token}"}
          )

          with urllib.request.urlopen(request) as response:
              jwt = json.load(response)["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("iss", "aud", "sub", "repository", "ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::723695983909:role/GitHub-ISO8583-QA-Role
          aws-region: us-east-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity
        
      - name: Trigger SSM connectivity check
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-092742ccfa413e5f3" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["echo GitHub-to-EC2-SSM-CONNECTED","whoami"]}' \
            --region us-east-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-092742ccfa413e5f3" \
            --region us-east-1 \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

